apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
  labels:
    app: api
spec:
  replicas: 1                  # se cambia con: kubectl scale deployment api-deployment --replicas=N
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: api-productos:1.0
        imagePullPolicy: Never # imagen cargada localmente con "kind load"
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          value: postgresql://postgres:postgres@postgres-service:5432/tienda
        resources:
          limits:
            cpu: "1"           # mismo limite que en docker-compose
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  type: NodePort
  selector:
    app: api
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30080          # kind lo expone en localhost:8080
